<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 250" role="img" aria-label="智能制造 24 个月路线图：S0 到 S4 五阶段">
  <defs>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#57534e"/>
    </marker>
  </defs>
  <g font-family="Geist, PingFang SC, Microsoft YaHei, sans-serif">
