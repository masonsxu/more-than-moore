    <text x="580" y="236" text-anchor="middle" font-size="11.5" fill="#6f665f">每一级为下一级供数：没有 S0 的采集覆盖率，S2 的统计限值就是空谈；没有 S2 的基线，S3 的模型没有可信标签</text>
