<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="失效电路图：接触开路（FIMV 加流测压）">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#57534e"/>
    </marker>
  </defs>
  <g font-family="Geist, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="20" y="24" font-size="15" font-weight="700" fill="#1c1917">失效电路图 ①：接触开路 —— FIMV 加流测压，电压顶到钳位</text>
    <text x="20" y="42" font-size="11" fill="#6f665f">模拟级原理（示意量级）；机制依据 US5365180A（对 pin–GND 二极管加流测压降）+ ADI MAX9979（FI 模式电压钳位），摘录已归档</text>

    <!-- PMU 框 -->
    <rect x="20" y="60" width="240" height="270" rx="10" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.25)" stroke-dasharray="5 4"/>
    <text x="36" y="84" font-size="12" font-weight="600" fill="#1c1917">ATE · PMU（FIMV 模式）</text>

    <!-- 电流源 -->
    <circle cx="100" cy="150" r="26" fill="#fff" stroke="rgba(28,25,23,0.3)" stroke-width="1.4"/>
    <line x1="88" y1="156" x2="112" y2="144" stroke="#1c1917" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="100" y="192" text-anchor="middle" font-size="10.5" fill="#1c1917">电流源 +100 μA</text>
    <text x="100" y="207" text-anchor="middle" font-size="9.5" fill="#6f665f">加流（I Force）</text>

    <!-- 串联安培计 -->
    <line x1="126" y1="150" x2="168" y2="150" stroke="#57534e" stroke-width="1.4"/>
    <circle cx="192" cy="150" r="20" fill="#fff" stroke="rgba(28,25,23,0.3)" stroke-width="1.4"/>
    <text x="192" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#1c1917">A</text>
    <text x="192" y="130" text-anchor="middle" font-size="9.5" fill="#6f665f">I ≈ 0（断路无电流）</text>

    <!-- 到针 -->
    <line x1="212" y1="150" x2="280" y2="150" stroke="#57534e" stroke-width="1.4"/>
    <text x="246" y="140" text-anchor="middle" font-size="9.5" fill="#6f665f">线缆 + 针卡</text>

    <!-- 电压表 -->
    <circle cx="100" cy="270" r="24" fill="#fff" stroke="rgba(28,25,23,0.3)" stroke-width="1.4"/>
    <text x="100" y="275" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">V</text>
    <text x="100" y="310" text-anchor="middle" font-size="10" font-weight="600" fill="#c2410c">读数 1.50 V（顶到钳位）</text>
    <line x1="100" y1="246" x2="100" y2="150" stroke="#57534e" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="100" y1="150" x2="76" y2="150" stroke="#57534e" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="36" y="120" font-size="9.5" fill="#c2410c">电压钳位 = 判别上界</text>

    <!-- 针与焊盘之间的开路 -->
    <polygon points="330,140 346,170 314,170" fill="#9aa7b8"/>
    <text x="330" y="128" text-anchor="middle" font-size="9.5" fill="#6f665f">针尖</text>
    <g stroke="#dc2626" stroke-width="2.4">
      <line x1="366" y1="140" x2="390" y2="164"/>
      <line x1="390" y1="140" x2="366" y2="164"/>
    </g>
    <text x="378" y="128" text-anchor="middle" font-size="10.5" font-weight="700" fill="#dc2626">开路</text>
    <text x="378" y="184" text-anchor="middle" font-size="9.5" fill="#dc2626">电流无路可走</text>

    <!-- 焊盘 + 二极管 + 轨 -->
    <rect x="416" y="150" width="44" height="24" rx="4" fill="#d9e2ec" stroke="rgba(28,25,23,0.3)"/>
    <text x="438" y="192" text-anchor="middle" font-size="10" fill="#1c1917">焊盘</text>
    <line x1="460" y1="162" x2="520" y2="162" stroke="#57534e" stroke-width="1.4"/>
    <polygon points="526,156 512,156 519,170" fill="#4ade80"/>
    <line x1="526" y1="162" x2="526" y2="196" stroke="#57534e" stroke-width="1.4"/>
    <text x="548" y="166" font-size="9.5" fill="#6f665f">D2（到 VSS）</text>
    <line x1="526" y1="196" x2="620" y2="196" stroke="#3c4658" stroke-width="4" stroke-linecap="round"/>
    <text x="628" y="200" font-size="10.5" font-weight="600" fill="#3c4658">VSS 地轨</text>

    <!-- 表头 -->
    <rect x="700" y="60" width="280" height="150" rx="10" fill="#0f172a"/>
    <text x="716" y="86" font-size="10" font-weight="700" letter-spacing="1" fill="#22d3ee">PMU 表头（示意量级）</text>
    <g font-family="Geist Mono, Menlo, monospace" font-size="12">
      <text x="716" y="112" fill="#94a3b8">强制: <tspan fill="#fbbf24">I = +100 μA</tspan></text>
      <text x="716" y="134" fill="#94a3b8">读数: <tspan fill="#f87171">V = 1.50 V（顶到钳位）</tspan></text>
      <text x="716" y="156" fill="#94a3b8">限值: <tspan fill="#4ade80">V ∈ 0.45 – 0.75 V</tspan></text>
      <text x="716" y="186" fill="#94a3b8">判定: <tspan fill="#f87171" font-weight="700">✗ FAIL → Bin1 · fail-stop 淘汰</tspan></text>
    </g>

    <text x="20" y="356" font-size="11" fill="#6f665f">判定逻辑一句话：加流后电路断开，节点被电流源推向电压钳位 → 读数超出「二极管压降窗」→ 窗口比较器判 FAIL → Bin1，不进修复。</text>
  </g>
</svg>
