<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" role="img" aria-label="物理电路图：探针到阵列的实物路径剖面">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#57534e"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c2410c"/>
    </marker>
  </defs>
  <g font-family="Geist, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="20" y="24" font-size="15" font-weight="700" fill="#1c1917">物理电路图（物理实现层）：PSWT 时电流实际走哪条路</text>
    <text x="20" y="42" font-size="11" fill="#6f665f">剖面为示意比例；三处下针位置与量化口径出自 SWTest 2017（SK hynix/FormFactor/Advantest）与 semiengineering 2026（摘录已归档）</text>

    <!-- 探针卡 -->
    <rect x="180" y="58" width="220" height="30" rx="6" fill="#2a3344"/>
    <text x="290" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="#e2e8f0">探针卡（≈2 万针 · 单针 2.5 g）</text>
    <!-- 针 -->
    <g fill="#9aa7b8">
      <polygon points="250,88 258,88 254,128"/>
      <polygon points="290,88 298,88 294,128"/>
      <polygon points="330,88 338,88 334,128"/>
    </g>
    <text x="254" y="140" font-size="10" fill="#6f665f">悬臂 / 垂直 MEMS 针</text>

    <!-- base die slab -->
    <rect x="150" y="130" width="420" height="86" rx="4" fill="#0f766e"/>
    <text x="168" y="206" font-size="11" font-weight="600" fill="#d1fae5">base die（堆叠晶圆翻转，背面朝上）</text>

    <!-- 铝焊盘（背面即上表面） -->
    <rect x="246" y="124" width="16" height="8" fill="#c3cad4"/>
    <text x="254" y="118" text-anchor="middle" font-size="9.5" fill="#6f665f">PSWT 铝焊盘</text>

    <!-- ESD 二极管对（在 base die 内部） -->
    <line x1="254" y1="132" x2="254" y2="152" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="254,158 246,144 262,144" fill="#4ade80"/>
    <line x1="254" y1="132" x2="330" y2="132" stroke="none"/>
    <line x1="254" y1="132" x2="340" y2="132" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="346,126 334,138 334,126" fill="none"/>
    <!-- 简化：从焊盘水平到两个二极管 -->
    <polygon points="352,132 338,124 338,140" fill="#4ade80"/>
    <polygon points="352,160 338,152 338,168" fill="#4ade80"/>
    <line x1="254" y1="132" x2="338" y2="132" stroke="#fbbf24" stroke-width="2"/>
    <line x1="254" y1="160" x2="338" y2="160" stroke="#fbbf24" stroke-width="2"/>
    <line x1="254" y1="132" x2="254" y2="160" stroke="#fbbf24" stroke-width="2"/>
    <line x1="352" y1="132" x2="400" y2="132" stroke="#e07b39" stroke-width="3"/>
    <text x="406" y="136" font-size="10" font-weight="600" fill="#c2410c">VDD 轨</text>
    <line x1="352" y1="160" x2="400" y2="160" stroke="#3c4658" stroke-width="3"/>
    <text x="406" y="164" font-size="10" font-weight="600" fill="#3c4658">VSS 轨</text>
    <text x="300" y="180" font-size="9.5" fill="#d1fae5">焊盘 → ESD 二极管对 → 电源轨（接触/PowerShort 测的就是这里）</text>

    <!-- DRAM 堆叠（base die 之下，剖面视角堆叠向下） -->
    <g fill="#2f4a6e">
      <rect x="150" y="222" width="420" height="9" rx="1"/>
      <rect x="150" y="237" width="420" height="9" rx="1"/>
      <rect x="150" y="252" width="420" height="9" rx="1"/>
      <rect x="150" y="267" width="420" height="9" rx="1"/>
      <rect x="150" y="282" width="420" height="9" rx="1"/>
      <rect x="150" y="297" width="420" height="9" rx="1"/>
      <rect x="150" y="312" width="420" height="9" rx="1"/>
      <rect x="150" y="327" width="420" height="9" rx="1"/>
      <rect x="150" y="342" width="420" height="9" rx="1"/>
      <rect x="150" y="357" width="420" height="9" rx="1"/>
      <rect x="150" y="372" width="420" height="9" rx="1"/>
      <rect x="150" y="387" width="420" height="9" rx="1"/>
    </g>
    <text x="580" y="300" font-size="10.5" fill="#6f665f">↑ 12 层 DRAM 核心裸片</text>
    <text x="580" y="318" font-size="9.5" fill="#6f665f">（MBiST 逐层激励：TSV 链自 base die</text>
    <text x="580" y="334" font-size="9.5" fill="#6f665f">向上穿到 D11，失效位图逐层落账）</text>

    <!-- TSV 链 -->
    <g stroke="#c9a227" stroke-width="3">
      <line x1="200" y1="216" x2="200" y2="396"/>
      <line x1="240" y1="216" x2="240" y2="396"/>
      <line x1="480" y1="216" x2="480" y2="396"/>
      <line x1="520" y1="216" x2="520" y2="396"/>
    </g>
    <text x="360" y="230" font-size="9.5" fill="#9a7b1c">TSV 链（每层穿透；TSV 开路 → column fail）</text>

    <!-- 测量回路（橙色虚线） -->
    <path d="M 60 78 L 180 66" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>
    <text x="56" y="70" text-anchor="end" font-size="10.5" font-weight="600" fill="#c2410c">ATE · PMU</text>
    <text x="56" y="86" text-anchor="end" font-size="9.5" fill="#6f665f">FVMI / FIMV</text>
    <path d="M 60 92 C 90 150 140 168 250 156" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrO)"/>
    <text x="96" y="146" font-size="9.5" fill="#c2410c">力与测量同端口</text>
    <path d="M 400 160 C 480 170 520 220 520 260" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="4 4" fill="none" opacity="0.7"/>

    <!-- 右侧 inset：三处下针位置 -->
    <rect x="700" y="58" width="440" height="330" rx="10" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.25)" stroke-dasharray="5 4"/>
    <text x="716" y="82" font-size="12.5" font-weight="600" fill="#1c1917">同一颗堆栈的三处「下针面」——按工序切换</text>

    <!-- inset 1 -->
    <rect x="716" y="96" width="408" height="80" rx="8" fill="#fff" stroke="rgba(28,25,23,0.22)" stroke-width="1.2"/>
    <text x="732" y="118" font-size="11" font-weight="600" fill="#1c1917">① 预堆叠晶圆 CP：DFT / 牺牲测试焊盘</text>
    <text x="732" y="136" font-size="9.5" fill="#6f665f">JEDEC 在 bump 版图预留焊盘位；量产用它（可大并行、不伤凸点），</text>
    <text x="732" y="152" font-size="9.5" fill="#6f665f">焊盘拉开间距后探针卡省约 80%（Aehr Test）</text>
    <rect x="1068" y="112" width="40" height="12" fill="#d9e2ec"/>
    <text x="1064" y="122" text-anchor="end" font-size="9" fill="#6f665f">牺牲焊盘</text>

    <!-- inset 2 -->
    <rect x="716" y="186" width="408" height="80" rx="8" fill="#fff" stroke="rgba(28,25,23,0.22)" stroke-width="1.2"/>
    <text x="732" y="208" font-size="11" font-weight="600" fill="#1c1917">② 堆栈 at-speed：JEDEC 直接访问凸点 ×176</text>
    <text x="732" y="226" font-size="9.5" fill="#6f665f">HBM2 每堆栈 3990 bump 中的测试专用入口（占 4.4%）；</text>
    <text x="732" y="242" font-size="9.5" fill="#6f665f">8 通道同时原生模式 &gt;2.4 Gbps（SWTest 2017 实测口径）</text>
    <circle cx="1076" cy="222" r="9" fill="#e05656"/>
    <text x="1076" y="248" text-anchor="middle" font-size="9" fill="#6f665f">DA 凸点</text>

    <!-- inset 3 -->
    <rect x="716" y="276" width="408" height="80" rx="8" fill="#fff" stroke="rgba(28,25,23,0.22)" stroke-width="1.2"/>
    <text x="732" y="298" font-size="11" font-weight="600" fill="#1c1917">③ PSWT：base die 背面铝焊盘（本图主剖面）</text>
    <text x="732" y="316" font-size="9.5" fill="#6f665f">堆叠后晶圆测试：翻转扎针，DC → 高低温 → 高频逐级；</text>
    <text x="732" y="332" font-size="9.5" fill="#6f665f">铝焊盘布在 bump 版图预留空间（Teradyne / semiengineering）</text>
    <rect x="1068" y="304" width="40" height="12" fill="#c3cad4"/>
    <text x="1064" y="314" text-anchor="end" font-size="9" fill="#6f665f">铝焊盘</text>

    <text x="716" y="386" font-size="10" fill="#c2410c">KGSD 的意义：堆栈在进入系统级封装前完成全测，</text>
    <text x="716" y="402" font-size="10" fill="#c2410c">坏堆栈不占昂贵的中介层位置（ServeTheHome / Hot Chips 2026 口径）</text>

    <text x="20" y="446" font-size="11" fill="#6f665f">读图顺序：针尖（力接触）→ 铝焊盘 → ESD 二极管对 → VDD/VSS 轨 → DRAM 阵列列 / TSV 链——与「设计电路图」一一对应，只是画在物理位置上。</text>
  </g>
</svg>
