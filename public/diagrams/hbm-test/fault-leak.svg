<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="失效电路图：输入漏电超标（灵敏量程抓 μA 级电流）">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#57534e"/>
    </marker>
  </defs>
  <g font-family="Geist, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="20" y="24" font-size="15" font-weight="700" fill="#1c1917">失效电路图 ④：输入漏电超标（IIL/IIH）—— 灵敏量程回测 μA 级电流</text>
    <text x="20" y="42" font-size="11" fill="#6f665f">模拟级原理（示意量级）；漏电常在 μA 级、须切 PMU 灵敏档（Marvin Test KB Q200207 原文口径，摘录已归档）</text>

    <rect x="20" y="60" width="240" height="270" rx="10" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.25)" stroke-dasharray="5 4"/>
    <text x="36" y="84" font-size="12" font-weight="600" fill="#1c1917">ATE · PMU（FVMI 模式）</text>

    <circle cx="100" cy="150" r="26" fill="#fff" stroke="rgba(28,25,23,0.3)" stroke-width="1.4"/>
    <text x="100" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#1c1917">VIH</text>
    <text x="100" y="160" text-anchor="middle" font-size="8.5" fill="#6f665f">spec 高电平</text>
    <text x="100" y="192" text-anchor="middle" font-size="10.5" fill="#1c1917">输入加 spec 电平</text>

    <line x1="126" y1="150" x2="168" y2="150" stroke="#57534e" stroke-width="1.4"/>
    <circle cx="192" cy="150" r="20" fill="#fff" stroke="#c2410c" stroke-width="1.6"/>
    <text x="192" y="155" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">Aμ</text>
    <text x="192" y="128" text-anchor="middle" font-size="9.5" fill="#c2410c">切 μA 灵敏量程</text>

    <line x1="212" y1="150" x2="330" y2="150" stroke="#57534e" stroke-width="1.4"/>
    <text x="268" y="140" text-anchor="middle" font-size="9.5" fill="#6f665f">线缆 + 针（接触良好，DC 前项已过）</text>

    <circle cx="100" cy="270" r="24" fill="#fff" stroke="rgba(28,25,23,0.3)" stroke-width="1.4"/>
    <text x="100" y="275" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">V</text>
    <text x="100" y="310" text-anchor="middle" font-size="10" fill="#6f665f">同步回测电压确认加对了</text>

    <!-- 输入缓冲器 + 栅氧弱点 -->
    <rect x="360" y="128" width="120" height="44" rx="8" fill="#fff" stroke="rgba(28,25,23,0.22)" stroke-width="1.2"/>
    <text x="420" y="146" text-anchor="middle" font-size="11" font-weight="600" fill="#1c1917">输入缓冲器</text>
    <text x="420" y="162" text-anchor="middle" font-size="9" fill="#6f665f">首级栅（正常不导通）</text>
    <line x1="330" y1="150" x2="356" y2="150" stroke="#57534e" stroke-width="1.4"/>

    <!-- 栅氧漏电路径 -->
    <line x1="420" y1="172" x2="420" y2="250" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="6 4"/>
    <polygon points="420,262 412,246 428,246" fill="#dc2626"/>
    <text x="436" y="222" font-size="10.5" font-weight="700" fill="#dc2626">栅氧弱点 / 阱漏电</text>
    <text x="436" y="238" font-size="9.5" fill="#dc2626">本应 &lt; 1 μA，实测 12 μA</text>

    <line x1="420" y1="266" x2="420" y2="292" stroke="#57534e" stroke-width="1.4"/>
    <line x1="360" y1="292" x2="640" y2="292" stroke="#3c4658" stroke-width="4" stroke-linecap="round"/>
    <text x="648" y="296" font-size="10.5" font-weight="600" fill="#3c4658">VSS</text>

    <!-- 表头 -->
    <rect x="700" y="60" width="280" height="150" rx="10" fill="#0f172a"/>
    <text x="716" y="86" font-size="10" font-weight="700" letter-spacing="1" fill="#22d3ee">PMU 表头（示意量级）</text>
    <g font-family="Geist Mono, Menlo, monospace" font-size="12">
      <text x="716" y="112" fill="#94a3b8">强制: <tspan fill="#fbbf24">V = VIH（spec 高电平）</tspan></text>
      <text x="716" y="134" fill="#94a3b8">读数: <tspan fill="#f87171">I = 12 μA（灵敏量程抓出）</tspan></text>
      <text x="716" y="156" fill="#94a3b8">限值: <tspan fill="#4ade80">I ≤ 1 μA</tspan></text>
      <text x="716" y="186" fill="#94a3b8">判定: <tspan fill="#f87171" font-weight="700">✗ FAIL → Bin1/2 · Leakage</tspan></text>
    </g>

    <text x="20" y="356" font-size="11" fill="#6f665f">判定逻辑一句话：结构上和接触测试共用焊盘，但电流小六个数量级——量程档（±2 μA 档）决定「看得见看不见」，这正是 DC 三件套要把 Leakage 单列一步的原因。</text>
  </g>
</svg>
