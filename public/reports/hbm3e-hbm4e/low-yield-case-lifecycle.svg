<svg viewBox="0 0 1000 896" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kgsd-lifecycle-title kgsd-lifecycle-desc" font-family="'Geist','PingFang SC','Microsoft YaHei',sans-serif">
  <title id="kgsd-lifecycle-title">量产低良 Case 生命周期</title>
  <desc id="kgsd-lifecycle-desc">低良警报触发后：冻结证据与 hold，数据有效性核查（不通过则关数据工单），基本盘七问与十类数据视图形成假设清单，围堵 ICA，证据三角验证（证伪则回到假设，证实进入双根因与永久对策），最后有效性确认并关闭。</desc>
  <defs>
    <marker id="kgsd-lc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
    <marker id="kgsd-lc-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c2410c"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- 连线（先画，位于节点之下） -->
  <line x1="440" y1="88" x2="440" y2="120" stroke="#57534e" stroke-width="1.2" marker-end="url(#kgsd-lc-arrow)"/>
  <line x1="440" y1="176" x2="440" y2="200" stroke="#57534e" stroke-width="1.2" marker-end="url(#kgsd-lc-arrow)"/>
  <line x1="564" y1="252" x2="724" y2="252" stroke="#57534e" stroke-width="1.2" marker-end="url(#kgsd-lc-arrow)"/>
  <line x1="440" y1="304" x2="440" y2="336" stroke="#57534e" stroke-width="1.2" marker-end="url(#kgsd-lc-arrow)"/>
  <line x1="440" y1="400" x2="440" y2="424" stroke="#57534e" stroke-width="1.2" marker-end="url(#kgsd-lc-arrow)"/>
  <line x1="440" y1="472" x2="440" y2="496" stroke="#57534e" stroke-width="1.2" marker-end="url(#kgsd-lc-arrow)"/>
  <path d="M 316 548 L 168 548 Q 160 548 160 540 L 160 376 Q 160 368 168 368 L 316 368" fill="none" stroke="#57534e" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#kgsd-lc-arrow)"/>
  <line x1="440" y1="600" x2="440" y2="632" stroke="#c2410c" stroke-width="1.4" marker-end="url(#kgsd-lc-arrow-accent)"/>
  <line x1="440" y1="696" x2="440" y2="728" stroke="#57534e" stroke-width="1.2" marker-end="url(#kgsd-lc-arrow)"/>

  <!-- 连线标签（节点之前绘制，遮罩不压后续节点） -->
  <rect x="628" y="232" width="32" height="12" rx="2" fill="#ffffff"/>
  <text x="644" y="241" fill="#6f665f" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
  <rect x="416" y="308" width="48" height="12" rx="2" fill="#ffffff"/>
  <text x="440" y="317" fill="#6f665f" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
  <rect x="172" y="508" width="116" height="12" rx="2" fill="#ffffff"/>
  <text x="230" y="517" fill="#6f665f" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">证伪 → 重排假设</text>
  <rect x="416" y="606" width="48" height="12" rx="2" fill="#ffffff"/>
  <text x="440" y="615" fill="#c2410c" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">证实</text>

  <!-- 节点 -->
  <rect x="320" y="40" width="240" height="48" rx="24" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
  <text x="440" y="61" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">低良警报</text>
  <text x="440" y="77" fill="#6f665f" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">SPC 判异 / YMS 告警 / PAT 超限</text>

  <rect x="320" y="120" width="240" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="440" y="142" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">冻结证据 + Hold 涉事 lot</text>
  <text x="440" y="158" fill="#6f665f" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">0–2h · WPFile/STDF · recipe 快照 · 针卡 TD</text>

  <polygon points="440,200 564,252 440,304 316,252" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="440" y="246" fill="#1c1917" font-size="11" font-weight="600" text-anchor="middle">数据有效性</text>
  <text x="440" y="260" fill="#1c1917" font-size="11" font-weight="600" text-anchor="middle">核查通过？</text>

  <rect x="724" y="228" width="240" height="48" rx="24" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
  <text x="844" y="248" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">关数据工单</text>
  <text x="844" y="264" fill="#6f665f" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">非产品 case · 修数据链路</text>

  <rect x="320" y="336" width="240" height="64" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="440" y="358" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">基本盘七问 + 十类数据视图</text>
  <text x="440" y="374" fill="#6f665f" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">趋势 · bin · map · site · retest · 参数</text>
  <text x="440" y="390" fill="#6f665f" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">→ 假设清单 + 优先级排序</text>

  <rect x="320" y="424" width="240" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="440" y="446" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">围堵 ICA</text>
  <text x="440" y="462" fill="#6f665f" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">hold / 分选 / 加严 · 24h 内初报</text>

  <polygon points="440,496 564,548 440,600 316,548" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="440" y="544" fill="#1c1917" font-size="11" font-weight="600" text-anchor="middle">证据三角</text>
  <text x="440" y="558" fill="#1c1917" font-size="11" font-weight="600" text-anchor="middle">闭合？</text>

  <rect x="320" y="632" width="240" height="64" rx="6" fill="rgba(194,65,12,0.08)" stroke="#c2410c" stroke-width="1"/>
  <text x="440" y="654" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">双根因 → 永久对策</text>
  <text x="440" y="670" fill="#6f665f" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">发生根因 + 流出根因</text>
  <text x="440" y="686" fill="#6f665f" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">D5 对策 · D7 预防体系化</text>

  <rect x="320" y="728" width="240" height="56" rx="28" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
  <text x="440" y="752" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">有效性确认 → 关闭</text>
  <text x="440" y="768" fill="#6f665f" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">连续 3 lot 达基线 · QE 签核</text>

  <!-- 图例：底部横条 -->
  <line x1="40" y1="824" x2="960" y2="824" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
  <text x="40" y="840" fill="#57534e" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>
  <rect x="40" y="854" width="24" height="12" rx="6" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
  <text x="72" y="864" fill="#57534e" font-size="8" font-family="'Geist Mono',monospace">起止</text>
  <rect x="140" y="854" width="24" height="12" rx="2" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="172" y="864" fill="#57534e" font-size="8" font-family="'Geist Mono',monospace">步骤</text>
  <polygon points="264,854 278,860 264,866 250,860" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="288" y="864" fill="#57534e" font-size="8" font-family="'Geist Mono',monospace">判定</text>
  <rect x="352" y="852" width="24" height="16" rx="4" fill="rgba(194,65,12,0.08)" stroke="#c2410c" stroke-width="1"/>
  <text x="384" y="864" fill="#57534e" font-size="8" font-family="'Geist Mono',monospace">根因/对策</text>
  <line x1="472" y1="860" x2="496" y2="860" stroke="#c2410c" stroke-width="1.4"/>
  <text x="504" y="864" fill="#57534e" font-size="8" font-family="'Geist Mono',monospace">证实路径</text>
  <line x1="580" y1="860" x2="604" y2="860" stroke="#57534e" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="612" y="864" fill="#57534e" font-size="8" font-family="'Geist Mono',monospace">证伪回路</text>
</svg>
